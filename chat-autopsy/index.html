      document.getElementById('chatInput').value = SAMPLES[k];
      document.getElementById('myNameInput').value = k === 'crush_kr' ? '민지' : (k === 'en_ghost' ? 'Me' : 'Jordan');
      analyzeChat();
    }

    document.getElementById('txtFile').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = ev => {
        document.getElementById('chatInput').value = String(ev.target.result || '').slice(0, 180000);
        analyzeChat();
      };
      reader.readAsText(f, 'utf-8');
    });

    function parseTimeMins(tStr) {
      if (!tStr) return null;
      const m = tStr.match(/(오전|오후|AM|PM)?\s*(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
      if (!m) return null;
      let hr = parseInt(m[2], 10);
      const mn = parseInt(m[3], 10);
      const ampm = (m[1] || m[4] || '').toUpperCase();
      if ((ampm === '오후' || ampm === 'PM') && hr < 12) hr += 12;
      if ((ampm === '오전' || ampm === 'AM') && hr === 12) hr = 0;
      return hr * 60 + mn;
    }

    function parseMessages(raw) {
      const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const msgs = [];
      const rxKakaoBracket = /^\[([^\]]+)\]\s*\[([^\]]+)\]\s*(.+)$/;
      const rxEnTime = /^([^:\[\]]{1,24})\s*\[([^\]]+)\]\s*:\s*(.+)$/;
      const rxKakaoMobile = /^\d{4}[.\-/년\s]+\d{1,2}[.\-/월\s]+\d{1,2}[^,]*,\s*([^:]+?)\s*:\s*(.+)$/;
      const rxColon = /^([^:\[\]]{1,24})\s*:\s*(.+)$/;

      for (const ln of lines) {
        if (ln.startsWith('---') || ln.includes('저장한 날짜')) continue;
        let m = ln.match(rxKakaoBracket) || ln.match(rxEnTime);
        if (m) { msgs.push({ sender: m[1].trim(), timeMins: parseTimeMins(m[2]), text: m[3].trim() }); continue; }
        m = ln.match(rxKakaoMobile);
        if (m) {
          const tMatch = ln.match(/(오전|오후|AM|PM)?\s*\d{1,2}:\d{2}\s*(AM|PM)?/i);
          msgs.push({ sender: m[1].trim(), timeMins: parseTimeMins(tMatch ? tMatch[0] : ''), text: m[2].trim() });
          continue;
        }
        m = ln.match(rxColon);
        if (m) msgs.push({ sender: m[1].trim(), timeMins: null, text: m[2].trim() });
      }
      return msgs;
    }

    function analyzeChat() {
      const raw = document.getElementById('chatInput').value.trim();
      if (!raw) return;
      sessionStorage.setItem('chatautopsy_last_raw', raw);
      sessionStorage.setItem('chatautopsy_last_me', document.getElementById('myNameInput').value.trim());

      const msgs = parseMessages(raw);
      if (msgs.length < 2) {
        alert(LANG === 'ko' ? '최소 2줄 이상의 대화를 입력해 주세요.' : 'Please paste at least 2 chat lines (e.g. Name: message).');
        return;
      }

      const counts = {};
      msgs.forEach(m => { counts[m.sender] = (counts[m.sender] || 0) + 1; });
      const speakers = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
      const manualMe = document.getElementById('myNameInput').value.trim();
      const me = (manualMe && speakers.find(s => s.toLowerCase().includes(manualMe.toLowerCase()))) || speakers[0];
      const them = speakers.find(s => s !== me) || (LANG === 'ko' ? '상대방' : 'Partner');

      let myChars = 0, theirChars = 0, myQs = 0, theirQs = 0, myDouble = 0, theirDouble = 0;
      let myDelays = [], theirDelays = [];
      const keyMoves = [];

      for (let i = 0; i < msgs.length; i++) {
        const cur = msgs[i];
        const isMe = cur.sender === me;
        const qCnt = (cur.text.match(/\?/g) || []).length;
        if (isMe) { myChars += cur.text.length; myQs += qCnt; }
        else { theirChars += cur.text.length; theirQs += qCnt; }

        if (i > 0) {
          const prev = msgs[i - 1];
          if (prev.sender === cur.sender) {
            if (isMe) {
              myDouble++;
              keyMoves.push({
                tag: '?? Blunder', cls: 'tag-blunder',
                text: LANG === 'ko'
                  ? `"${cur.text.slice(0, 42)}..." — 답장 오기 전 연속 추격톡 전송 (프레임 급락)`
                  : `"${cur.text.slice(0, 42)}..." — Unprompted double-text chase before reply`
              });
            } else {
              theirDouble++;
              keyMoves.push({
                tag: '!! Brilliant', cls: 'tag-brilliant',
                text: LANG === 'ko' ? `상대의 연속 선톡 감지: "${cur.text.slice(0, 40)}..."` : `Partner double-texted enthusiastically: "${cur.text.slice(0, 40)}..."`
              });
            }
          } else if (prev.timeMins !== null && cur.timeMins !== null) {
            let diff = cur.timeMins - prev.timeMins;
            if (diff < 0) diff += 1440;
            if (diff <= 720) { if (isMe) myDelays.push(diff); else theirDelays.push(diff); }
            if (isMe && diff <= 2 && (theirDelays[theirDelays.length - 1] || 0) >= 60) {
              keyMoves.push({
                tag: '?! Inaccuracy', cls: 'tag-inacc',
                text: LANG === 'ko'
                  ? `상대는 1시간+ 지연 답장했는데 2분 만에 즉각 칼답 ("${cur.text.slice(0, 34)}...")`
                  : `Instant 1-min reply right after they left you waiting 1h+ ("${cur.text.slice(0, 34)}...")`
              });
            }
          }
          if (!isMe && cur.text.length <= 14 && !cur.text.includes('?') && prev.text.length >= 25) {
            keyMoves.push({
              tag: '🧊 Dry Wall', cls: 'tag-inacc',
              text: LANG === 'ko' ? `장문 투자에 대한 상대의 건조한 단답: "${cur.text}"` : `Low-effort dry reply against high investment: "${cur.text}"`
            });
          }
          if (!isMe && cur.text.includes('?')) {
            keyMoves.push({
              tag: '!! Green Flag', cls: 'tag-brilliant',
              text: LANG === 'ko' ? `상대가 먼저 호기심 역질문 투척: "${cur.text.slice(0, 44)}"` : `Partner actively asked back: "${cur.text.slice(0, 44)}"`
            });
          }
        }
      }

      const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 12;
      const latencyRatio = Math.max(1, avg(theirDelays)) / Math.max(1, avg(myDelays));
      const charShare = myChars / Math.max(1, myChars + theirChars);
      let myInvestPct = Math.round(Math.min(92, Math.max(12, charShare * 55 + Math.min(35, latencyRatio * 5) + myDouble * 6 - theirDouble * 6)));
      let theirInvestPct = 100 - myInvestPct;
      let interestScore = Math.round(Math.min(96, Math.max(9,
        55 + (theirQs - myQs) * 9 - (latencyRatio - 1) * 6 + (theirChars / Math.max(1, myChars) - 1) * 18 + theirDouble * 10 - myDouble * 7
      )));
      let myElo = Math.round(Math.min(2200, Math.max(420, 1250 - myDouble * 140 - Math.max(0, latencyRatio - 2) * 35 + theirQs * 55)));
      const blunderCount = myDouble + (latencyRatio > 5 ? 2 : 0) + (myQs > theirQs + 2 ? 1 : 0);

      LAST_REPORT = { me, them, myInvestPct, theirInvestPct, interestScore, myElo, latencyRatio, blunderCount, theirQs, myQs };

      document.getElementById('resultSection').style.display = 'block';
      document.getElementById('barMe').style.width = myInvestPct + '%';
      document.getElementById('barMe').textContent = `${me} ${myInvestPct}%`;
      document.getElementById('barThem').textContent = `${them} ${theirInvestPct}%`;

      if (LANG === 'ko') {
        document.getElementById('kpiMyElo').textContent = myElo + (myElo < 950 ? ' (호구 주의)' : (myElo > 1400 ? ' (고수)' : ' (평범)'));
        document.getElementById('kpiInterest').textContent = `${interestScore}% ` + (interestScore >= 68 ? '🔥 그린라이트' : (interestScore >= 42 ? '⚠️ 관망' : '🚨 어장·회피'));
        document.getElementById('kpiLatency').textContent = latencyRatio >= 1.3 ? `내가 ${latencyRatio.toFixed(1)}배 칼답` : `상대가 ${(1/latencyRatio).toFixed(1)}배 칼답`;
        document.getElementById('kpiBlunders').textContent = `${blunderCount}건`;
      } else {
        document.getElementById('kpiMyElo').textContent = myElo + (myElo < 950 ? ' (Chasing)' : (myElo > 1400 ? ' (Grandmaster)' : ' (Solid)'));
        document.getElementById('kpiInterest').textContent = `${interestScore}% ` + (interestScore >= 68 ? '🔥 High' : (interestScore >= 42 ? '⚠️ Lukewarm' : '🚨 Breadcrumbing'));
        document.getElementById('kpiLatency').textContent = latencyRatio >= 1.3 ? `${latencyRatio.toFixed(1)}x Over-Eager` : `${(1/latencyRatio).toFixed(1)}x In Your Favor`;
        document.getElementById('kpiBlunders').textContent = `${blunderCount}`;
      }

      const verdictEl = document.getElementById('headlineVerdict');
      if (LANG === 'ko') {
        verdictEl.innerHTML = interestScore < 48
          ? `🚨 <strong>긴급 진단:</strong> 현재 <strong>${me}</strong>님이 대화를 인공호흡기로 살리고 있습니다(질문 비율 ${myQs}:${theirQs}). 지금 습관대로 한 번만 더 먼저 묻거나 재촉하면 주도권 회복이 불가능해집니다.`
          : `💘 <strong>호감 신호 포착:</strong> 상대(<strong>${them}</strong>)도 대화에 충분히 반응하고 있습니다. 텐션을 끌지 말고 정확한 타이밍에 약속 프레임을 잡으세요.`;
      } else {
        verdictEl.innerHTML = interestScore < 48
          ? `🚨 <strong>Engine Alert:</strong> <strong>${me}</strong> is carrying ${myInvestPct}% of the conversational load (Questions ${myQs}:${theirQs}). Sending one more eager check-in cements a low-attraction dynamic.`
          : `💘 <strong>Strong Mutual Signal:</strong> <strong>${them}</strong> is actively reciprocating (${theirQs} counter-questions). Lock in concrete plans before momentum cools.`;
      }

      const movesHtml = (keyMoves.slice(0, 4).length ? keyMoves.slice(0, 4) : [
        { tag: '?! Balance', cls: 'tag-inacc', text: LANG === 'ko' ? `글자수 투자 ${myChars}자 vs ${theirChars}자` : `Character volume ${myChars} vs ${theirChars}` }
      ]).map(m => `<div class="move-item"><span class="chess-tag ${m.cls}">${m.tag}</span><span style="flex:1; color:#cbd5e1;">${m.text}</span></div>`).join('');
      document.getElementById('movesContainer').innerHTML = movesHtml;

      populatePrescription(LAST_REPORT);
    }

    function populatePrescription(rep) {
      const diag = document.getElementById('deepDiagnosis');
      const dont = document.getElementById('dontSendBox');
      const scripts = document.getElementById('replyScriptsBox');

      if (LANG === 'ko') {
        if (rep.interestScore < 50) {
          diag.innerHTML = `<strong>[${rep.them}의 숨은 본심]</strong> 상대는 당신을 '언제든 답장해주는 안전한 선택지'로 인식해 긴장감이 꺼진 상태입니다. 매력이 없어서가 아니라 여백 없이 추격해 도파민이 차단된 전형적 과투자 구간입니다.`;
          dont.textContent = `❌ 절대 금지: "바빠?", "주말 일정 나왔어?", "나한테 서운한 거 있어?" 등 확인·재촉형 질문 금지.`;
          scripts.innerHTML = `<div class="script-box"><strong>1. [미러링 무심 컷]</strong> 상대 평균 답장시간의 1.5배 이상 간격을 둔 뒤 질문 없이 짧은 긍정("오 알겠어 편히 쉬어~")으로 먼저 대화를 끊으세요.</div><div class="script-box"><strong>2. [무압박 콜백 훅 (3~4일 뒤)]</strong> 약속 요구 없이 둘만 아는 가벼운 사진/한 줄("지나가다 이거 봤는데 웃기더라ㅋㅋ")만 던지고 즉시 종료.</div><div class="script-box"><strong>3. [일정 보류 대처 역전 멘트]</strong> "이번 주는 나도 약속이 다 차버려서ㅋㅋ 담주 시간 맞으면 보자!"</div>`;
        } else {
          diag.innerHTML = `<strong>[${rep.them}의 숨은 본심]</strong> 상대는 이미 그린라이트를 켜두고 당신이 구체적인 리드를 해주길 기다리고 있습니다.`;
          dont.textContent = `❌ 절대 금지: "언제 시간 돼?"처럼 결정 부담을 떠넘기는 모호한 질문.`;
          scripts.innerHTML = `<div class="script-box"><strong>1. [A/B 데이트 확정]</strong> "금요일 저녁이랑 토요일 점심 중 언제가 더 편해요? 맛있는 곳 알아뒀어요ㅎㅎ"</div><div class="script-box"><strong>2. [호감 텐션 상승]</strong> "대화할수록 결이 잘 맞네요ㅋㅋ 실제로 보면 시간 순삭일 듯!"</div><div class="script-box"><strong>3. [여운 남기는 클로징]</strong> 대화가 가장 즐거울 때 "내일 일찍 일정 있어서 먼저 자볼게요! 내일 봐요 :)"</div>`;
        }
      } else {
        if (rep.interestScore < 50) {
          diag.innerHTML = `<strong>[Hidden Subtext of ${rep.them}]</strong> Right now ${rep.them} experiences zero uncertainty—your rapid replies and question volume (${rep.myQs} vs ${rep.theirQs}) removed the space needed for curiosity to build.`;
          dont.textContent = `❌ Fatal Blunder: Do NOT send "hey stranger", "still down for this week?", or double-question marks (??).`;
          scripts.innerHTML = `<div class="script-box"><strong>1. [The High-Status Mirror Close]</strong> Wait 1.5x their last reply time, then end the thread cleanly with zero questions: "Gotcha, have a good week!" Let silence create tension.</div><div class="script-box"><strong>2. [Zero-Pressure Callback (72h later)]</strong> Drop a playful observation tied to an inside joke with zero ask attached: "Walked past [callback] and laughed, elite tier."</div><div class="script-box"><strong>3. [Flipping "I'll let you know"]</strong> "All good, my week actually just filled up too—let's catch up next week if schedules line up!"</div>`;
        } else {
          diag.innerHTML = `<strong>[Hidden Subtext of ${rep.them}]</strong> High buying temperature detected—they are actively investing and waiting for decisive leadership.`;
          dont.textContent = `❌ Avoid vague "whenever works for you!" passivity—it kills momentum.`;
          scripts.innerHTML = `<div class="script-box"><strong>1. [The A/B Date Lock]</strong> "Let's do Thursday at 7:30 or Saturday afternoon—which works better for you?"</div><div class="script-box"><strong>2. [Playful Frame]</strong> "Okay solid answer, you officially passed the vibe check. Drinks are on you first round."</div><div class="script-box"><strong>3. [Peak-Exit Close]</strong> Exit on a high note: "Gotta crash early tonight, talk tomorrow :)"</div>`;
        }
      }
    }

    function startPaypalUnlock(e) {
      e.preventDefault();
      const amount = CFG.priceUsd || '0.99';
      const returnUrl = window.location.origin + window.location.pathname + '?paid=1&lang=' + LANG;
      if (CFG.paypalBusinessEmail) {
        const item = LANG === 'ko' ? 'ChatAutopsy 심층 심리 처방전 & 역전 멘트' : 'TextElo Full Subtext & High-Elo Reply Prescription';
        window.location.href = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=${encodeURIComponent(CFG.paypalBusinessEmail)}&item_name=${encodeURIComponent(item)}&amount=${amount}&currency_code=USD&no_shipping=1&return=${encodeURIComponent(returnUrl)}`;
      }
      return false;
    }

    function verifyCode() {
      const v = document.getElementById('inpUnlockCode').value.trim().toUpperCase();
      if (v === (CFG.unlockCode || 'FLIP77')) unlockReport();
      else alert(LANG === 'ko' ? '코드가 올바르지 않습니다.' : 'Invalid unlock code.');
    }

    function unlockReport() {
      document.getElementById('paywallCard').classList.add('unlocked');
      localStorage.setItem('chatautopsy_paid', '1');
    }

    function downloadReceiptPng() {
      if (!LAST_REPORT) return;
      const c = document.getElementById('receiptCanvas');
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#0b0f1c';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.strokeStyle = '#f43f5e';
      ctx.lineWidth = 4;
      ctx.strokeRect(16, 16, c.width - 32, c.height - 32);

      ctx.fillStyle = '#f43f5e';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText(LANG === 'ko' ? '🧾 카톡·DM 관계 권력 부검 영수증' : '♟️ TEXTING ELO POWER RECEIPT', 42, 68);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '16px sans-serif';
      ctx.fillText(`${LAST_REPORT.me}  vs  ${LAST_REPORT.them}`, 42, 104);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 32px sans-serif';
      ctx.fillText(
        LANG === 'ko'
          ? `상대 호감도: ${LAST_REPORT.interestScore}%  |  내 Elo: ${LAST_REPORT.myElo}`
          : `Attraction: ${LAST_REPORT.interestScore}%  |  Text Elo: ${LAST_REPORT.myElo}`,
        42, 168
      );

      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 21px sans-serif';
      ctx.fillText(
        LANG === 'ko'
          ? `감정 투자 비율: 나 ${LAST_REPORT.myInvestPct}% vs 상대 ${LAST_REPORT.theirInvestPct}%`
          : `Investment Split: You ${LAST_REPORT.myInvestPct}% vs Them ${LAST_REPORT.theirInvestPct}%`,
        42, 224
      );
      ctx.fillText(
        LANG === 'ko' ? `적발된 자폭 블런더(??): ${LAST_REPORT.blunderCount}건` : `Detected ?? Blunders: ${LAST_REPORT.blunderCount}`,
        42, 266
      );

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(42, 305, 556, 34);
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(42, 305, Math.round(556 * (LAST_REPORT.myInvestPct / 100)), 34);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 17px sans-serif';
      ctx.fillText((LANG === 'ko' ? '무료 판독 👉 ' : 'Test yours 👉 ') + 'choikim0108.github.io/text-elo-lab', 42, 465);

      const a = document.createElement('a');
      a.href = c.toDataURL('image/png');
      a.download = 'text_elo_receipt.png';
      a.click();
    }

    window.addEventListener('DOMContentLoaded', () => {
      applyLangUI();
      const savedRaw = sessionStorage.getItem('chatautopsy_last_raw');
      const savedMe = sessionStorage.getItem('chatautopsy_last_me');
      if (savedRaw) {
        document.getElementById('chatInput').value = savedRaw;
        if (savedMe) document.getElementById('myNameInput').value = savedMe;
        analyzeChat();
      }
      if (window.location.search.includes('paid=1') || localStorage.getItem('chatautopsy_paid') === '1') {
        unlockReport();
      }
    });
  </script>
